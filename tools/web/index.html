<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift, cabinet</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0c; color: #848078;
    font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; text-transform: uppercase; }
  canvas { width: min(960px, 96vw); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; display: block; }
  p { text-align: center; }
</style>
</head>
<body>
<main>
  <canvas id="screen" width="320" height="240" aria-label="Night Shift"></canvas>
  <p>Arrows · Z / Enter select · X / Backspace cancel <span id="out"></span></p>
</main>
<script type="module">
  import { createCabinet } from './host.js';
  const out = document.getElementById('out');
  const cabinet = await createCabinet({
    canvas: document.getElementById('screen'),
    storageKey: 'night-shift-cabinet-page',
    onOpen: (url) => { out.textContent = ' · would walk to ' + url; },
    onError: (e) => console.error(e),
  });
  cabinet.start();
  const MAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', z: 'select', Z: 'select', Enter: 'select', x: 'back', X: 'back', Backspace: 'back' };
  addEventListener('keydown', (e) => { const k = MAP[e.key]; if (k) { e.preventDefault(); cabinet.press(k, true); } });
  addEventListener('keyup', (e) => { const k = MAP[e.key]; if (k) cabinet.press(k, false); });
  addEventListener('blur', () => cabinet.releaseAll());
  addEventListener('pagehide', () => cabinet.save());
</script>
</body>
</html>
